name: Sync and Build APK

on:
  schedule:
    - cron: '0 0 * * *'       # 每天 UTC 00:00 (北京时间 08:00) 自动触发
  workflow_dispatch:          # 支持在 GitHub Actions 页面手动点击运行
  push:
    branches: [ "master", "main" ]

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 赋予工作流推送代码的权限（用于同步上游代码）

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master         # 如果你的主分支是 main，请把这里和下面同步步骤的 master 改成 main
          fetch-depth: 0

      - name: Sync Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kuangru52/YuyanImeK.git || true
          git fetch upstream
          git merge upstream/master -m "Auto sync from upstream" || git merge upstream/main -m "Auto sync from upstream" || true
          git push origin HEAD || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Force Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuyanImeK-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
