name: Sync and Build APK

on:
  schedule:
    - cron: '0 0 * * *'       # 每天 UTC 00:00 (北京时间 08:00) 自动触发
  workflow_dispatch:          # 支持在 GitHub Actions 页面手动点击运行
  push:
    branches: [ "master", "main" ]

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 赋予工作流推送代码的权限（用于同步上游代码）

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master         # 如果你的主分支是 main，请把这里和下面同步步骤的 master 改成 main
          fetch-depth: 0

      - name: Sync Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kuangru52/YuyanImeK.git || true
          git fetch upstream
          # 尝试合并上游代码，兼容 master 或 main
          git merge upstream/master -m "Auto sync from upstream" || git merge upstream/main -m "Auto sync from upstream" || true
          git push origin HEAD || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: '' # 关键：置空，避免安装已失效的 'tools' 包导致失败
          accept-android-sdk-licenses: true

      - name: Force Accept Android SDK Licenses
        run: |
          set -euo pipefail
          # 预创建许可文件，直接绕过交互式提示
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/google-tv-preview-license
          
          # 使用 yes 命令并处理管道正常关闭（SIGPIPE）
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses > /dev/null || [[ "${PIPESTATUS[1]}" -eq 0 ]]

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK Files (Debug)
        run: find . -name "*.apk" # 这一步会在日志里打印出所有生成的 APK 的路径

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuyanImeK-Debug-APK
          path: "**/*.apk" # 关键修改：全盘搜索所有 apk 文件，确保不漏
          retention-days: 14
