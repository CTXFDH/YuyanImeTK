-dontusemixedcaseclassnames
-ignorewarnings
-verbose

-dontwarn org.apache.**
-dontwarn android.support.v4.**

# Keep R classes
-keepclassmembers class **.R$* {
    public static <fields>;
}

# Keep Native Methods & JNI Bridge
-keepclasseswithmembernames class * {
    native <methods>;
}
-keep class com.yuyan.inputmethod.** { *; }
-keep class com.k2fsa.sherpa.onnx.** { *; }
-keep class com.yuyan.imemodule.speech.** { *; }
-keep class com.yuyan.imemodule.service.IInferenceAsr** { *; }
-keep class com.yuyan.imemodule.service.AsrInferenceService { *; }

# Keep Custom Views & Attributes
-keepclasseswithmembers class * {
    public <init>(android.content.Context, android.util.AttributeSet);
    public <init>(android.content.Context, android.util.AttributeSet, int);
}

-keepclassmembers class * extends android.app.Activity {
    public void *(android.view.View);
}

# Keep Parcelables & Enums
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

-keepnames class * implements android.os.Parcelable {
    public static final ** CREATOR;
}

# Keep Room Database Entities & DAOs
-keep class com.yuyan.imemodule.database.entry.** { *; }
-keep class com.yuyan.imemodule.database.dao.** { *; }

# Attributes
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
