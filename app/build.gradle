plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 36
    namespace 'com.yuyan'
    defaultConfig {
        applicationId "com.yuyan.pinyin"
        minSdk 23
        targetSdk 36
        versionCode Integer.valueOf(versionCodeDate())
        versionName "K61"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        lintOptions {
            abortOnError false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/jni/CMakeLists.txt")
            version "3.22.1"
        }
    }

    aaptOptions {
        noCompress 'onnx', 'model'
    }
    
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            def keystoreFilePath = System.getenv("RELEASE_STORE_FILE") ?: keystoreProperties.getProperty('storeFile')
            def keystorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: keystoreProperties.getProperty('storePassword')
            def keyAliasName = System.getenv("RELEASE_KEY_ALIAS") ?: keystoreProperties.getProperty('keyAlias')
            def keyPasswordValue = System.getenv("RELEASE_KEY_PASSWORD") ?: keystoreProperties.getProperty('keyPassword')
            if (keystoreFilePath) {
                def keystoreFile = rootProject.file(keystoreFilePath)
                if (keystoreFile.exists() && keystorePassword && keyAliasName && keyPasswordValue) {
                    storeFile keystoreFile
                    storePassword keystorePassword
                    keyAlias keyAliasName
                    keyPassword keyPasswordValue
                    v1SigningEnabled true
                    v2SigningEnabled true
                }
            }
        }
    }

    //多渠道打包
    flavorDimensions = ["default"]
    productFlavors {
        offline {
            dimension "default"
            applicationIdSuffix  ".offline"
        }
    }

    buildTypes {
        release {
            // 混淆
            minifyEnabled true
            shrinkResources true
            applicationIdSuffix  ".release"
            resValue "string", "app_name", "语燕输入法K"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "语燕输入法Kt"
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }

    }
    //    第三方库使用java1.8
    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "YuyanImeK-K${getKVersionCode()}_${versionCodeDate()}_${variant.buildType.name}.apk"
        }
    }
}

static def getKVersionCode() {
    return 61 // K版当前版本号: K61
}

static def versionCodeDate() {
    return new Date().format("yyyyMMddHH", TimeZone.getTimeZone("GMT+8"))
}

static def versionNameDate() {
    return new Date().format("yyyyMMdd.HH", TimeZone.getTimeZone("GMT+8")) + " (K" + getKVersionCode() + ")"
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':yuyansdk')
}

task generateYusThemes {
    doLast {
        def outputDir = file("${project.rootDir}/theme")
        outputDir.mkdirs()

        def themes = [
            [name: "薄荷夏日", isDark: false, barColor: "#FFDCEDC8", keyboardColor: "#FFE8F5E9", keyBackgroundColor: "#FFFFFFFF", keyTextColor: "#FF2E7D32", accentKeyBackgroundColor: "#FF10B981", accentKeyTextColor: "#FFFFFFFF", functionKeyBackgroundColor: "#FFC8E6C9", toolbarTextColor: "#FF1B5E20", toolbarActiveIconColor: "#FF10B981"],
            [name: "日落晚霞", isDark: false, barColor: "#FFFFE0B2", keyboardColor: "#FFFFF3E0", keyBackgroundColor: "#FFFFFFFF", keyTextColor: "#FFE65100", accentKeyBackgroundColor: "#FFFF6F00", accentKeyTextColor: "#FFFFFFFF", functionKeyBackgroundColor: "#FFFFCC80", toolbarTextColor: "#FFBF360C", toolbarActiveIconColor: "#FFFF6F00"],
            [name: "海盐芝士", isDark: false, barColor: "#FFB2EBF2", keyboardColor: "#FFE0F7FA", keyBackgroundColor: "#FFFFFDE7", keyTextColor: "#FF006064", accentKeyBackgroundColor: "#FF00ACC1", accentKeyTextColor: "#FFFFFFFF", functionKeyBackgroundColor: "#FF80DEEA", toolbarTextColor: "#FF004D40", toolbarActiveIconColor: "#FF00ACC1"],
            [name: "静谧香草", isDark: false, barColor: "#FFEFEBE9", keyboardColor: "#FFF5F5DC", keyBackgroundColor: "#FFFFFFFF", keyTextColor: "#FF4E342E", accentKeyBackgroundColor: "#FF8D6E63", accentKeyTextColor: "#FFFFFFFF", functionKeyBackgroundColor: "#FFD7CCC8", toolbarTextColor: "#FF3E2723", toolbarActiveIconColor: "#FF8D6E63"],
            [name: "紫罗兰风信子", isDark: false, barColor: "#FFE1BEE7", keyboardColor: "#FFF3E5F5", keyBackgroundColor: "#FFFFFFFF", keyTextColor: "#FF4A148C", accentKeyBackgroundColor: "#FF8E24AA", accentKeyTextColor: "#FFFFFFFF", functionKeyBackgroundColor: "#FFCE93D8", toolbarTextColor: "#FF4A148C", toolbarActiveIconColor: "#FF8E24AA"],
            [name: "暗夜极光", isDark: true, barColor: "#FF1E293B", keyboardColor: "#FF121A21", keyBackgroundColor: "#FF1E2D3D", keyTextColor: "#FFE2E8F0", accentKeyBackgroundColor: "#FF00F5D4", accentKeyTextColor: "#FF0F172A", functionKeyBackgroundColor: "#FF27374D", toolbarTextColor: "#FF00F5D4", toolbarActiveIconColor: "#FF00F5D4"],
            [name: "黑金尊享", isDark: true, barColor: "#FF222222", keyboardColor: "#FF181818", keyBackgroundColor: "#FF2A2A2A", keyTextColor: "#FFF5D061", accentKeyBackgroundColor: "#FFD4AF37", accentKeyTextColor: "#FF121212", functionKeyBackgroundColor: "#FF333333", toolbarTextColor: "#FFF5D061", toolbarActiveIconColor: "#FFD4AF37"],
            [name: "深空幻紫", isDark: true, barColor: "#FF241442", keyboardColor: "#FF1A0B2E", keyBackgroundColor: "#FF2D1954", keyTextColor: "#FFF3E8FF", accentKeyBackgroundColor: "#FFB5179E", accentKeyTextColor: "#FFFFFFFF", functionKeyBackgroundColor: "#FF3C226B", toolbarTextColor: "#FFE9D5FF", toolbarActiveIconColor: "#FFF72585"],
            [name: "灰阶复古", isDark: true, barColor: "#FF282D2A", keyboardColor: "#FF1F2421", keyBackgroundColor: "#FF363C38", keyTextColor: "#FFDCE1DE", accentKeyBackgroundColor: "#FF495852", accentKeyTextColor: "#FFFFFFFF", functionKeyBackgroundColor: "#FF2D3430", toolbarTextColor: "#FFDCE1DE", toolbarActiveIconColor: "#FFA3B18A"],
            [name: "深海幽蓝", isDark: true, barColor: "#FF1C2541", keyboardColor: "#FF0B132B", keyBackgroundColor: "#FF202C59", keyTextColor: "#FFE0E1DD", accentKeyBackgroundColor: "#FF3A86FF", accentKeyTextColor: "#FFFFFFFF", functionKeyBackgroundColor: "#FF1F2D5A", toolbarTextColor: "#FF60A5FA", toolbarActiveIconColor: "#FF3A86FF"]
        ]

        themes.each { t ->
            def yusFile = file("${outputDir}/${t.name}.yus")
            if (yusFile.exists()) yusFile.delete()

            def jsonText = """{
  "name": "${t.name}",
  "isDark": ${t.isDark},
  "backgroundImage": null,
  "customLogoFilePath": null,
  "customLogoCropRect": null,
  "keyboardResources": 0,
  "barColor": "${t.barColor}",
  "keyboardColor": "${t.keyboardColor}",
  "keyBackgroundColor": "${t.keyBackgroundColor}",
  "keyTextColor": "${t.keyTextColor}",
  "keySmallSymbolColor": "${t.keyTextColor}",
  "accentKeyBackgroundColor": "${t.accentKeyBackgroundColor}",
  "accentKeyTextColor": "${t.accentKeyTextColor}",
  "keyPressHighlightColor": "${t.isDark ? '#33FFFFFF' : '#1F000000'}",
  "popupBackgroundColor": "${t.barColor}",
  "functionKeyBackgroundColor": "${t.functionKeyBackgroundColor}",
  "functionKeyPressHighlightColor": "${t.isDark ? '#1FFFFFFF' : '#1F000000'}",
  "deleteKeyBackgroundColor": "${t.functionKeyBackgroundColor}",
  "clearKeyBackgroundColor": "${t.functionKeyBackgroundColor}",
  "returnKeyBackgroundColor": "${t.accentKeyBackgroundColor}",
  "shiftKeyBackgroundColor": "${t.functionKeyBackgroundColor}",
  "shiftKeyActiveBackgroundColor": "${t.accentKeyBackgroundColor}",
  "shiftKeyLockBackgroundColor": "${t.accentKeyBackgroundColor}",
  "atKeyBackgroundColor": "${t.accentKeyBackgroundColor}",
  "symbolKeyBackgroundColor": "${t.functionKeyBackgroundColor}",
  "numberKeyBackgroundColor": "${t.functionKeyBackgroundColor}",
  "sideSymbolKeyBackgroundColor": "${t.functionKeyBackgroundColor}",
  "sideSymbolKeyTextColor": "${t.toolbarTextColor}",
  "sideSymbolKeyPressColor": "${t.isDark ? '#33FFFFFF' : '#1F000000'}",
  "arrowButtonBackgroundColor": "${t.functionKeyBackgroundColor}",
  "toolbarTextColor": "${t.toolbarTextColor}",
  "toolbarActiveIconColor": "${t.toolbarActiveIconColor}",
  "candidateTextColor": "${t.toolbarTextColor}",
  "backgroundBlurRadius": 0,
  "keyCustomOverrides": {},
  "version": "2.0"
}"""

            def fos = new java.io.FileOutputStream(yusFile)
            def zos = new java.util.zip.ZipOutputStream(fos)
            def entry = new java.util.zip.ZipEntry("theme.json")
            zos.putNextEntry(entry)
            zos.write(jsonText.getBytes("UTF-8"))
            zos.closeEntry()
            zos.close()
            fos.close()
        }
    }
}
